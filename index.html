<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hygge</title>
<meta name="theme-color" content="#5b3a28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hygge">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f7f2;--card:#fffdf8;--ink:#4a2f20;--soft:#8a7766;--wood:#5b3a28;--gold:#b8924a;--flame:#e8892b;--line:#e6dccb;--on-wood:#fbf3e4;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1611;--card:#2a1e17;--ink:#f3e8d6;--soft:#b9a48d;--wood:#7a4f35;--gold:#d3ad66;--flame:#f0a04b;--line:#43322a;--on-wood:#fbf3e4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1611;--card:#2a1e17;--ink:#f3e8d6;--soft:#b9a48d;--wood:#7a4f35;--gold:#d3ad66;--flame:#f0a04b;--line:#43322a;--on-wood:#fbf3e4;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0;font-weight:700}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.logo{display:block;width:min(220px,60%);margin:8px auto 4px;border-radius:24px}
.lead{text-align:center;color:var(--soft);margin:0 0 20px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tile:nth-child(3n+2){border-radius:18px 18px 18px 6px}
.tile .e{font-size:28px;line-height:1}.tile b{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;line-height:1.1}
.tile small{color:var(--soft);font-size:13px}
.tile:active{background:var(--line)}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.back{border:0;background:var(--wood);color:var(--on-wood);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.top h2{font-size:30px}
button:focus-visible,input:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg{display:flex;background:var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;font:600 15px Nunito,sans-serif;color:var(--soft);padding:8px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--wood);color:var(--on-wood)}
.add{display:flex;gap:8px;margin-bottom:14px}
input[type=text]{flex:1;min-width:0;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.btn{border:0;background:var(--flame);color:#3a1d0a;font:700 15px Nunito,sans-serif;padding:0 18px;border-radius:12px;cursor:pointer;min-height:44px}
.sec{font-size:20px;margin:18px 0 8px;color:var(--soft)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row label{flex:1;cursor:pointer}.row.done label{text-decoration:line-through;color:var(--soft)}
.row input{width:22px;height:22px;accent-color:var(--wood)}
.x{border:0;background:none;color:var(--soft);font-size:22px;cursor:pointer;padding:0 4px}
.empty{color:var(--soft);font-style:italic;padding:6px 2px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h3{font-size:26px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dn{text-align:center;font-size:12px;color:var(--soft);font-weight:700}
.d{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:64px;padding:3px;font:inherit;font-size:9.5px;line-height:1.15;text-align:left;color:var(--ink);cursor:pointer;overflow:hidden}
.d i{display:block;font:700 12px Nunito,sans-serif;font-style:normal;margin-bottom:2px}
.d.today{border:2px solid var(--flame)}.d.void{visibility:hidden}
.d span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d .l{color:var(--gold)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
.file{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(30,18,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:26px;margin-bottom:12px}.sheet label{display:block;font-weight:700;margin:8px 0 4px;font-size:14px}
.sheet .btn{margin-top:14px;width:100%}
.foot{text-align:center;color:var(--soft);font-size:12px;margin-top:28px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--wood);color:var(--on-wood);padding:10px 16px;border-radius:12px;z-index:30;max-width:90%}
</style>
</head>

/* ---------- Acceso ---------- */
function loginView(){return logoImg()+'<p class="lead">Entra con tu correo o usuario. Sin contraseñas.</p><div class="add"><input type="text" id="em" inputmode="email" autocomplete="email" placeholder="tu correo" aria-label="Tu correo" onkeydown="if(event.key===\'Enter\')send()"><button class="btn" onclick="send()">Enviar enlace</button></div><p class="lead" id="lm"></p>'}
function send(){var e=$("em").value.trim();if(!e)return;$("lm").textContent="Enviando…";
SB.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname}}).then(function(r){$("lm").textContent=r.error?"No se pudo enviar: "+r.error.message:"Listo. Abre el enlace que te hemos enviado al correo."})}
SB.auth.onAuthStateChange(function(ev,s){setTimeout(function(){ready=true;user=s?s.user:null;if(user){refresh();sub()}else render()},0)});

/* ---------- Datos ---------- */
function refresh(){return Promise.all([SB.from("items").select("*").order("created_at"),SB.from("meals").select("*"),SB.from("photos").select("*").order("created_at",{ascending:false})]).then(function(r){
if(r[0].error){toast("Error al cargar: "+r[0].error.message);return}
S.items=r[0].data;S.meals={};(r[1].data||[]).forEach(function(m){S.meals[m.day]={c:m.lunch,d:m.dinner}});
var ph=r[2].data||[];if(!ph.length){S.photos=[];return}
return SB.storage.from("photos").createSignedUrls(ph.map(function(p){return p.path}),3600).then(function(u){S.photos=ph.map(function(p,i){return{id:p.id,path:p.path,url:u.data&&u.data[i]?u.data[i].signedUrl:""}})})
}).then(render)}
function sub(){if(subbed)return;subbed=true;var t;SB.channel("hygge").on("postgres_changes",{event:"*",schema:"public"},function(){clearTimeout(t);t=setTimeout(refresh,400)}).subscribe()}

/* ---------- Pantallas ---------- */
function render(){var pv=$("in"),val=pv?pv.value:"",foc=pv&&document.activeElement===pv,h="";
if(!ready){h='<p class="lead">Cargando…</p>'}
else if(!user){h=loginView()}
else{var id=location.hash.slice(1),sec=SECS.filter(function(s){return s.id===id})[0];
if(!sec){h=logoImg()+'<p class="lead">Nuestro rincón de casa, para los dos.</p><div class="grid">'+SECS.map(function(s){return'<button class="tile" onclick="location.hash=\''+s.id+'\'"><span class="e">'+s.e+'</span><b>'+s.t+'</b><small>'+s.s+'</small></button>'}).join("")+'</div><p class="foot">'+esc(user.email)+' · <button class="x" style="font-size:13px" onclick="SB.auth.signOut()">Salir</button></p>'}
else{h='<div class="top"><button class="back" aria-label="Volver" onclick="location.hash=\'\'">‹</button><h2>'+sec.e+' '+sec.t+'</h2></div>'+(sec.id==="fotos"?photos():sec.id==="menu"?cal():lists(sec))}}
$("app").innerHTML=h;if(foc&&$("in")){$("in").value=val;$("in").focus()}}
function lists(sec){var L=sec.L,i=tab[sec.id]||0,l=L[i],k=l[0],a=S.items.filter(function(x){return x.list===k}),h="";
if(L.length>1)h+='<div class="seg">'+L.map(function(x,j){return'<button class="'+(j===i?"on":"")+'" onclick="tab[\''+sec.id+'\']='+j+';render()">'+x[1]+'</button>'}).join("")+'</div>';
h+='<div class="add"><input type="text" id="in" placeholder="'+l[4]+'" aria-label="'+l[4]+'" onkeydown="if(event.key===\'Enter\')addI(\''+k+'\')"><button class="btn" onclick="addI(\''+k+'\')">Añadir</button></div>';
[false,true].forEach(function(d){var rows=a.filter(function(x){return x.done===d});
h+='<h3 class="sec">'+l[d?3:2]+'</h3>';
h+=rows.length?rows.map(function(x){return'<div class="row'+(d?" done":"")+'"><input type="checkbox" id="c'+x.id+'"'+(d?" checked":"")+' onchange="tog(\''+x.id+'\')"><label for="c'+x.id+'">'+esc(x.text)+'</label><button class="x" aria-label="Borrar" onclick="del(\''+x.id+'\')">×</button></div>'}).join(""):'<p class="empty">'+(d?"Todavía nada por aquí.":"Todo al día. Añade lo primero arriba.")+'</p>'});
return h}
function addI(k){var v=$("in").value.trim();if(!v)return;$("in").value="";
SB.from("items").insert({list:k,text:v}).select().single().then(function(r){if(r.error)return toast("No se pudo guardar: "+r.error.message);S.items.push(r.data);render();$("in")&&$("in").focus()})}
function tog(id){var it=S.items.filter(function(x){return x.id===id})[0];it.done=!it.done;render();
SB.from("items").update({done:it.done}).eq("id",id).then(function(r){if(r.error){toast("Error: "+r.error.message);refresh()}})}
function del(id){S.items=S.items.filter(function(x){return x.id!==id});render();
SB.from("items").delete().eq("id",id).then(function(r){if(r.error){toast("Error: "+r.error.message);refresh()}})}

var MN=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

"LMXJVSD".split("").forEach(function(c){h+='<div class="dn">'+c+'</div>'});

return h+'</div><p class="foot">Toca un día para apuntar la comida (dorado) y la cena.</p>'}
function mv(n){month.setMonth(month.getMonth()+n);render()}
function dayEd(d){var y=month.getFullYear(),m=month.getMonth(),k=key(y,m,d),e=S.meals[k]||{},s=document.createElement("div");s.className="sheet";
s.innerHTML='<div><h3>'+d+' de '+MN[m]+'</h3><label for="mc">Comida</label><input type="text" id="mc" value="'+esc(e.c||"")+'"><label for="md">Cena</label><input type="text" id="md" value="'+esc(e.d||"")+'"><button class="btn" id="sv">Guardar</button></div>';
s.onclick=function(ev){if(ev.target===s)s.remove()};document.body.appendChild(s);$("mc").focus();
$("sv").onclick=function(){var c=$("mc").value.trim(),n=$("md").value.trim();S.meals[k]={c:c,d:n};s.remove();render();
SB.from("meals").upsert({day:k,lunch:c,dinner:n}).then(function(r){if(r.error)toast("No se pudo guardar: "+r.error.message)})}}

/* ---------- Fotos ---------- */
function photos(){return'<span class="file btn">+ Añadir fotos<input type="file" accept="image/*" multiple aria-label="Añadir fotos" onchange="addP(this.files)"></span><div class="gal">'+S.photos.map(function(p,i){return'<img src="'+p.url+'" alt="Foto '+(i+1)+'" loading="lazy" onclick="big('+i+')">'}).join("")+'</div>'+(S.photos.length?"":'<p class="empty">Aún no hay fotos. Sube la primera.</p>')}
function toBlob(f){return new Promise(function(res){var im=new Image();im.onload=function(){var k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(res,"image/jpeg",.8)};im.src=URL.createObjectURL(f)})}
function addP(fs){toast("Subiendo…");Promise.all(Array.prototype.map.call(fs,function(f){return toBlob(f).then(function(b){var path=user.id+"/"+Date.now()+Math.random().toString(36).slice(2,6)+".jpg";
return SB.storage.from("photos").upload(path,b,{contentType:"image/jpeg"}).then(function(r){if(r.error)throw r.error;return SB.from("photos").insert({path:path})})})})).then(function(){toast("Fotos subidas");return refresh()}).catch(function(e){toast("Error: "+e.message)})}
function big(i){var p=S.photos[i],s=document.createElement("div");s.className="sheet";s.style.alignItems="center";
s.innerHTML='<div style="background:none;text-align:center;padding:0"><img src="'+p.url+'" alt="Foto ampliada" style="max-width:94%;max-height:78vh;border-radius:14px"><br><button class="btn" id="dp" style="width:auto;padding:0 18px;margin-top:14px;background:var(--card);color:var(--ink)">Borrar foto</button></div>';
s.onclick=function(e){if(e.target!==$("dp"))s.remove()};document.body.appendChild(s);
$("dp").onclick=function(){s.remove();SB.storage.from("photos").remove([p.path]);SB.from("photos").delete().eq("id",p.id).then(refresh)}}

window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});render();
</script>
</body>
