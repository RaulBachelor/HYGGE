<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hygge</title>
<meta name="theme-color" content="#fff1e4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hygge">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f7f2;--card:#fffdf8;--ink:#4a2f20;--soft:#8a7766;--wood:#5b3a28;--gold:#b8924a;--flame:#e8892b;--line:#e6dccb;--on-wood:#fbf3e4;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1611;--card:#2a1e17;--ink:#f3e8d6;--soft:#b9a48d;--wood:#7a4f35;--gold:#d3ad66;--flame:#f0a04b;--line:#43322a;--on-wood:#fbf3e4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1611;--card:#2a1e17;--ink:#f3e8d6;--soft:#b9a48d;--wood:#7a4f35;--gold:#d3ad66;--flame:#f0a04b;--line:#43322a;--on-wood:#fbf3e4;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0;font-weight:700}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.logo{display:block;width:min(420px,92%);height:auto;max-height:240px;object-fit:contain;margin:8px auto 4px;border-radius:24px}
.lead{text-align:center;color:var(--soft);margin:0 0 20px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tile:nth-child(3n+2){border-radius:18px 18px 18px 6px}
.tile .e{font-size:28px;line-height:1}.tile b{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;line-height:1.1}
.tile small{color:var(--soft);font-size:13px}
.tile:active{background:var(--line)}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.back{border:0;background:var(--wood);color:var(--on-wood);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.top h2{font-size:30px}
button:focus-visible,input:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg{display:flex;background:var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;font:600 15px Nunito,sans-serif;color:var(--soft);padding:8px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--wood);color:var(--on-wood)}
.add{display:flex;gap:8px;margin-bottom:14px}
input[type=text]{flex:1;min-width:0;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.btn{border:0;background:var(--flame);color:#3a1d0a;font:700 15px Nunito,sans-serif;padding:0 18px;border-radius:12px;cursor:pointer;min-height:44px}
.sec{font-size:20px;margin:18px 0 8px;color:var(--soft)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row label{flex:1;cursor:pointer}.row.done label{text-decoration:line-through;color:var(--soft)}
.row input{width:22px;height:22px;accent-color:var(--wood)}
.x{border:0;background:none;color:var(--soft);font-size:22px;cursor:pointer;padding:0 4px}
.empty{color:var(--soft);font-style:italic;padding:6px 2px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h3{font-size:26px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dn{text-align:center;font-size:12px;color:var(--soft);font-weight:700}
.d{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:64px;padding:3px;font:inherit;font-size:9.5px;line-height:1.15;text-align:left;color:var(--ink);cursor:pointer;overflow:hidden}
.d i{display:block;font:700 12px Nunito,sans-serif;font-style:normal;margin-bottom:2px}
.d.today{border:2px solid var(--flame)}.d.void{visibility:hidden}
.d span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d .l{color:var(--gold)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
.file{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(30,18,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:26px;margin-bottom:12px}.sheet label{display:block;font-weight:700;margin:8px 0 4px;font-size:14px}
.sheet .btn{margin-top:14px;width:100%}
.foot{text-align:center;color:var(--soft);font-size:12px;margin-top:28px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--wood);color:var(--on-wood);padding:10px 16px;border-radius:12px;z-index:30;max-width:90%}

/* ---------- Corcho compartido ---------- */
.cork-hero{position:relative;overflow:hidden;border:1px solid #c69b69;border-radius:22px;padding:22px 18px;margin:10px 0 18px;background:radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.18),transparent 45%),repeating-linear-gradient(7deg,rgba(100,57,26,.035) 0 2px,transparent 2px 7px),linear-gradient(135deg,#c99460,#b77c4d);box-shadow:inset 0 1px 8px rgba(83,44,19,.18),0 5px 14px rgba(67,39,22,.10);color:#fff8eb;text-align:center}
.cork-hero:before,.cork-hero:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#f6e4c6;box-shadow:inset 0 1px 2px #8c5d3c,0 1px 2px #704526;top:12px}
.cork-hero:before{left:14px}.cork-hero:after{right:14px}
.cork-kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.cork-count{font:700 clamp(38px,10vw,58px)/1.05 "Cormorant Garamond",Georgia,serif;margin:5px 0 2px;text-shadow:0 2px 2px rgba(70,39,18,.18)}
.cork-sub{font-size:14px;opacity:.95}
.cork-date{font-size:12px;opacity:.85;margin-top:7px}
.cork-title{font-size:23px;color:var(--soft);margin:18px 0 9px}
.cork-add{margin:0 0 16px}
.cork-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cork-note{position:relative;min-height:118px;padding:18px 13px 14px;background:#fff0b8;color:#58432a;border-radius:3px 3px 8px 3px;box-shadow:0 3px 8px rgba(62,40,22,.16);transform:rotate(-1deg);overflow-wrap:anywhere}
.cork-note:nth-child(4n+2){background:#f6d9d2;transform:rotate(1.2deg)}
.cork-note:nth-child(4n+3){background:#dce8d2;transform:rotate(.7deg)}
.cork-note:nth-child(4n){background:#dce8ef;transform:rotate(-.8deg)}
.cork-note:before{content:"";position:absolute;top:7px;left:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:#b85e45;box-shadow:0 1px 2px #75402f}
.cork-note p{margin:7px 0 4px;font-size:14px;line-height:1.4;white-space:pre-wrap}
.cork-note .x{position:absolute;right:7px;top:7px;color:#775e47;font-size:18px}
.cork-empty{border:1px dashed #c69b69;border-radius:14px;padding:18px;text-align:center;color:var(--soft);grid-column:1/-1}
@media(min-width:520px){.cork-notes{grid-template-columns:repeat(3,minmax(0,1fr))}}


/* ---------- Diseño Hygge: portada cálida ---------- */

.home-board:before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(131,73,34,.12);pointer-events:none}
.home-counter{position:relative;width:min(520px,78%);margin:0 auto 22px;padding:23px 20px 19px;text-align:center;color:#542b19;background:#fff0d9;border:1px solid #d9ad7c;border-radius:16px;box-shadow:0 5px 12px rgba(66,37,18,.2);transform:rotate(-1deg)}
.home-counter:before{content:"";position:absolute;top:-14px;left:calc(50% - 14px);width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d99a62,#88431f 70%);box-shadow:0 2px 4px #633719}
.home-kicker{font:600 25px/1.1 "Cormorant Garamond",Georgia,serif;font-style:italic}
.home-count{font:700 clamp(48px,8vw,76px)/1.05 "Cormorant Garamond",Georgia,serif;margin:3px 0}
.home-date{font:600 18px "Cormorant Garamond",Georgia,serif}
.home-heart{font-size:24px;color:#8e3f20}
.home-notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:center;margin:0 0 18px}
.home-note{position:relative;min-height:165px;padding:28px 17px 16px;text-align:center;display:flex;align-items:center;justify-content:center;background:#f7d9d3;color:#563322;border-radius:2px 2px 8px 2px;box-shadow:0 5px 10px rgba(51,28,12,.24);transform:rotate(-2deg);font:600 22px/1.25 "Cormorant Garamond",Georgia,serif;overflow-wrap:anywhere;white-space:pre-wrap}
.home-note:nth-child(3n+2){background:#ffe39b;transform:rotate(2deg)}.home-note:nth-child(3n){background:#e0e8d5;transform:rotate(-1deg)}
.home-note:before{content:"";position:absolute;top:-9px;left:calc(50% - 8px);width:16px;height:16px;border-radius:50%;background:#b84f39;box-shadow:0 2px 3px rgba(30,15,5,.35)}
.home-note .x{position:absolute;right:7px;top:5px;color:#77513c;font:22px Nunito,sans-serif}
.home-add{display:flex;gap:10px;max-width:620px;margin:0 auto 0;padding:8px;background:rgba(255,242,222,.94);border-radius:16px;box-shadow:0 3px 8px rgba(53,29,13,.15)}
.home-add input{background:#fffaf3!important;border-color:#e5c7a8!important;border-radius:12px!important}
.home-add .btn{background:#fff4e4;color:#71391f;border:1px solid #e7c9a8;border-radius:14px;font:700 18px "Cormorant Garamond",Georgia,serif;min-height:48px}
.home-empty{grid-column:1/-1;text-align:center;color:#fff5e8;font:italic 21px "Cormorant Garamond",Georgia,serif;padding:25px 10px}
.home-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:26px 2px}
.home-shortcut{display:flex;align-items:center;gap:18px;text-align:left;min-height:120px;padding:20px 22px;border:1px solid #efd0b3;border-radius:28px;background:rgba(255,250,243,.88);color:#542b19;box-shadow:0 3px 7px rgba(113,57,31,.08);cursor:pointer}
.home-shortcut .ico{font-size:42px;min-width:52px;text-align:center}.home-shortcut b{display:block;font:700 27px/1.05 "Cormorant Garamond",Georgia,serif}.home-shortcut small{display:block;color:#87553c;font-size:16px;margin-top:5px}.home-shortcut .chev{margin-left:auto;font-size:30px}
.home-tagline{text-align:center;font:italic 29px "Cormorant Garamond",Georgia,serif;margin:25px 0 34px;color:#75452d}
.home-nav{display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,250,243,.94);border:1px solid #efd0b3;border-radius:26px;padding:13px 5px;box-shadow:0 3px 9px rgba(113,57,31,.08);position:sticky;bottom:8px;z-index:8}
.home-nav button{border:0;border-right:1px solid #e7c9ae;background:none;color:#71391f;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;font:600 16px "Cormorant Garamond",Georgia,serif;cursor:pointer}.home-nav button:last-child{border-right:0}.home-nav .navico{font:26px Nunito,sans-serif}.home-nav button.active{font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:7px}
.home-footer{text-align:center;color:#956c55;font:italic 17px "Cormorant Garamond",Georgia,serif;margin:8px 0 20px}
@media(max-width:620px){main{padding:9px 10px 22px}.home-header{margin-bottom:15px;border-radius:16px}.home-header img{aspect-ratio:3.8/1}.home-board{min-height:0;padding:17px 12px 14px;border-width:5px;border-radius:18px;margin-bottom:20px}.home-counter{width:88%;padding:17px 10px 14px;margin-bottom:17px}.home-kicker{font-size:21px}.home-date{font-size:15px}.home-notes{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-bottom:15px}.home-note{min-height:125px;padding:23px 10px 12px;font-size:19px}.home-add{padding:6px;gap:6px}.home-add input{padding:10px 9px;font-size:13px}.home-add .btn{font-size:16px;padding:0 12px}.home-shortcuts{gap:10px;margin:19px 0}.home-shortcut{min-height:100px;padding:12px 10px;gap:8px;border-radius:19px}.home-shortcut .ico{font-size:29px;min-width:32px}.home-shortcut b{font-size:20px}.home-shortcut small{font-size:12px}.home-shortcut .chev{font-size:22px}.home-tagline{font-size:21px;margin:20px 0 25px}.home-nav{bottom:4px;border-radius:20px;padding:8px 2px}.home-nav button{font-size:13px}.home-nav .navico{font-size:22px}}
@media(max-width:380px){.home-shortcut{gap:5px;padding:10px 7px}.home-shortcut b{font-size:18px}.home-shortcut small{font-size:11px}.home-note{font-size:17px}}

</style>
</head>

var TOGETHER_SINCE="2025-08-15";
function daysTogether(){
var a=new Date(TOGETHER_SINCE+"T00:00:00"),b=new Date();
b.setHours(0,0,0,0);
return Math.max(0,Math.floor((b-a)/86400000));
}
function corkboard(){
var notes=S.items.filter(function(x){return x.list==="corcho"&&!x.done;});
var count=daysTogether();
var h='<section class="cork-hero"><div class="cork-kicker">Nuestro pequeño universo</div><div class="cork-count">'+count+'</div><div class="cork-sub">días compartiendo camino ❤️</div><div class="cork-date">Desde el 15 de agosto de 2025</div></section>';

h+='<div class="add cork-add"><input type="text" id="in" maxlength="240" placeholder="Una idea, un recuerdo, algo bonito…" aria-label="Nueva nota para el corcho" onkeydown="if(event.key===\'Enter\')addI(\'corcho\')"><button class="btn" onclick="addI(\'corcho\')">Pinchar</button></div>';
h+='<div class="cork-notes">';
h+=notes.length?notes.map(function(x){return '<article class="cork-note"><button class="x" aria-label="Borrar nota" onclick="del(\''+x.id+'\')">×</button><p>'+esc(x.text)+'</p></article>'}).join(""):'<div class="cork-empty">Este corcho está esperando vuestros primeros recuerdos.<br>Dejad aquí una nota bonita, un plan o una idea 💛</div>';

return h;
}

h+=shortcuts.map(function(x){return '<button class="home-shortcut" data-route="'+x[0]+'" onclick="location.hash=this.dataset.route"><span class="ico">'+x[1]+'</span><span><b>'+x[2]+'</b><small>'+x[3]+'</small></span><span class="chev">›</span></button>'}).join('');
h+='</div><div class="home-tagline">Un lugar pequeñito para todas nuestras cosas bonitas. ♡</div>';
h+='<nav class="home-nav" aria-label="Navegación principal"><button class="active" data-route="" onclick="location.hash=this.dataset.route"><span class="navico">⌂</span>Inicio</button><button data-route="menu" onclick="location.hash=this.dataset.route"><span class="navico">▦</span>Calendario</button><button data-route="casa" onclick="location.hash=this.dataset.route"><span class="navico">⌂</span>Casa</button><button data-route="fotos" onclick="location.hash=this.dataset.route"><span class="navico">▧</span>Galería</button><button data-route="hogar" onclick="location.hash=this.dataset.route"><span class="navico">☰</span>Más</button></nav>';
h+='<p class="home-footer">'+esc(user.email)+' · <button class="x" style="font-size:14px" onclick="SB.auth.signOut()">Salir</button></p>';
return h;
}

function lists(sec){var L=sec.L,i=tab[sec.id]||0,l=L[i],k=l[0],a=S.items.filter(function(x){return x.list===k}),h="";
if(L.length>1)h+='<div class="seg">'+L.map(function(x,j){return'<button class="'+(j===i?"on":"")+'" onclick="tab[\''+sec.id+'\']='+j+';render()">'+x[1]+'</button>'}).join("")+'</div>';
h+='<div class="add"><input type="text" id="in" placeholder="'+l[4]+'" aria-label="'+l[4]+'" onkeydown="if(event.key===\'Enter\')addI(\''+k+'\')"><button class="btn" onclick="addI(\''+k+'\')">Añadir</button></div>';
[false,true].forEach(function(d){var rows=a.filter(function(x){return x.done===d});
h+='<h3 class="sec">'+l[d?3:2]+'</h3>';
h+=rows.length?rows.map(function(x){return'<div class="row'+(d?" done":"")+'"><input type="checkbox" id="c'+x.id+'"'+(d?" checked":"")+' onchange="tog(\''+x.id+'\')"><label for="c'+x.id+'">'+esc(x.text)+'</label><button class="x" aria-label="Borrar" onclick="del(\''+x.id+'\')">×</button></div>'}).join(""):'<p class="empty">'+(d?"Todavía nada por aquí.":"Todo al día. Añade lo primero arriba.")+'</p>'});
return h}
function addI(k){var v=$("in").value.trim();if(!v)return;$("in").value="";
SB.from("items").insert({list:k,text:v}).select().single().then(function(r){if(r.error)return toast("No se pudo guardar: "+r.error.message);S.items.push(r.data);render();$("in")&&$("in").focus()})}
function tog(id){var it=S.items.filter(function(x){return x.id===id})[0];it.done=!it.done;render();
SB.from("items").update({done:it.done}).eq("id",id).then(function(r){if(r.error){toast("Error: "+r.error.message);refresh()}})}
function del(id){S.items=S.items.filter(function(x){return x.id!==id});render();
SB.from("items").delete().eq("id",id).then(function(r){if(r.error){toast("Error: "+r.error.message);refresh()}})}

/* ---------- Menú del mes ---------- */
var MN=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function key(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function cal(){var y=month.getFullYear(),m=month.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=new Date(),h="";
h+='<div class="cal-h"><button class="back" aria-label="Mes anterior" onclick="mv(-1)">‹</button><h3>'+MN[m]+" "+y+'</h3><button class="back" aria-label="Mes siguiente" onclick="mv(1)">›</button></div><div class="cal">';
"LMXJVSD".split("").forEach(function(c){h+='<div class="dn">'+c+'</div>'});
for(var i=0;i<first;i++)h+='<div class="d void"></div>';
for(var d=1;d<=n;d++){var e=S.meals[key(y,m,d)]||{},td=t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===d;
h+='<button class="d'+(td?" today":"")+'" onclick="dayEd('+d+')"><i>'+d+'</i>'+(e.c?'<span class="l">'+esc(e.c)+'</span>':"")+(e.d?'<span>'+esc(e.d)+'</span>':"")+'</button>'}
return h+'</div><p class="foot">Toca un día para apuntar la comida (dorado) y la cena.</p>'}
function mv(n){month.setMonth(month.getMonth()+n);render()}
function dayEd(d){var y=month.getFullYear(),m=month.getMonth(),k=key(y,m,d),e=S.meals[k]||{},s=document.createElement("div");s.className="sheet";
s.innerHTML='<div><h3>'+d+' de '+MN[m]+'</h3><label for="mc">Comida</label><input type="text" id="mc" value="'+esc(e.c||"")+'"><label for="md">Cena</label><input type="text" id="md" value="'+esc(e.d||"")+'"><button class="btn" id="sv">Guardar</button></div>';
s.onclick=function(ev){if(ev.target===s)s.remove()};document.body.appendChild(s);$("mc").focus();
$("sv").onclick=function(){var c=$("mc").value.trim(),n=$("md").value.trim();S.meals[k]={c:c,d:n};s.remove();render();
SB.from("meals").upsert({day:k,lunch:c,dinner:n}).then(function(r){if(r.error)toast("No se pudo guardar: "+r.error.message)})}}

/* ---------- Fotos ---------- */
function photos(){return'<span class="file btn">+ Añadir fotos<input type="file" accept="image/*" multiple aria-label="Añadir fotos" onchange="addP(this.files)"></span><div class="gal">'+S.photos.map(function(p,i){return'<img src="'+p.url+'" alt="Foto '+(i+1)+'" loading="lazy" onclick="big('+i+')">'}).join("")+'</div>'+(S.photos.length?"":'<p class="empty">Aún no hay fotos. Sube la primera.</p>')}
function toBlob(f){return new Promise(function(res){var im=new Image();im.onload=function(){var k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(res,"image/jpeg",.8)};im.src=URL.createObjectURL(f)})}
function addP(fs){toast("Subiendo…");Promise.all(Array.prototype.map.call(fs,function(f){return toBlob(f).then(function(b){var path=user.id+"/"+Date.now()+Math.random().toString(36).slice(2,6)+".jpg";
return SB.storage.from("photos").upload(path,b,{contentType:"image/jpeg"}).then(function(r){if(r.error)throw r.error;return SB.from("photos").insert({path:path})})})})).then(function(){toast("Fotos subidas");return refresh()}).catch(function(e){toast("Error: "+e.message)})}
function big(i){var p=S.photos[i],s=document.createElement("div");s.className="sheet";s.style.alignItems="center";
s.innerHTML='<div style="background:none;text-align:center;padding:0"><img src="'+p.url+'" alt="Foto ampliada" style="max-width:94%;max-height:78vh;border-radius:14px"><br><button class="btn" id="dp" style="width:auto;padding:0 18px;margin-top:14px;background:var(--card);color:var(--ink)">Borrar foto</button></div>';
s.onclick=function(e){if(e.target!==$("dp"))s.remove()};document.body.appendChild(s);
$("dp").onclick=function(){s.remove();SB.storage.from("photos").remove([p.path]);SB.from("photos").delete().eq("id",p.id).then(refresh)}}

window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});render();
</script>
</body>
